<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное - Вкусный Блог</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <h1 class="site-title">🍜 Вкусный Блог</h1>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-button"><i class="fas fa-home"></i> На главную</a></li>
                    <li><a href="add-recipe.html" class="nav-button"><i class="fas fa-plus-circle"></i> Добавить рецепт</a></li>
                    <li><a href="menu-generator.html" class="nav-button"><i class="fas fa-calendar-week"></i> Меню</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="main-content">
        <section class="favorites-section">
            <div class="container">
                <h2 class="section-title">❤️ Мои избранные рецепты</h2>
                <div class="favorites-container" id="favorites-container"></div>
                <div class="empty-favorites" id="empty-favorites"><i class="fas fa-heart-broken"></i><h3>Нет избранных рецептов</h3><a href="index.html" class="nav-button">Найти рецепты</a></div>
            </div>
        </section>
    </div>

    <footer class="footer">
        <div class="container"><div class="footer-content"><div class="footer-main"><p class="footer-slogan">Вкус, который объединяет 🌏</p><p class="footer-copyright">© 2025 Вкусный Блог.</p></div><div class="course-work"><p class="course-work-text">Курсовая работа Гончаров К.И.</p></div></div></div>
    </footer>

    <script src="https://kit.fontawesome.com/e755f937eb.js" crossorigin="anonymous"></script>
    <script>
        function getDemoRecipes() {
            return [
                { id: 1, title: "Паста Карбонара", description: "Классическая итальянская паста...", image: "./images/pasta-carbonara.webp", time: "25 мин", difficulty: "medium", difficultyText: "Средняя", type: "demo" },
                { id: 2, title: "Тирамису", description: "Нежнsый десерт...", image: "./images/tir.jpg", time: "40 мин", difficulty: "easy", difficultyText: "Лёгкая", type: "demo" },
                { id: 3, title: "Рамен с курицей", description: "Японский суп...", image: "./images/ramen.webp", time: "35 мин", difficulty: "hard", difficultyText: "Сложная", type: "demo" },
                { id: 4, title: "Салат Цезарь", description: "Хрустящий салат...", image: "./images/cezar.webp", time: "15 мин", difficulty: "easy", difficultyText: "Лёгкая", type: "demo" },
                { id: 5, title: "Пицца Маргарита", description: "Томаты, моцарелла...", image: "./images/ppizzamargarita.webp", time: "30 мин", difficulty: "medium", difficultyText: "Средняя", type: "demo" },
                { id: 6, title: "Борщ", description: "Насыщенный суп...", image: "./images/borsh.webp", time: "60 мин", difficulty: "hard", difficultyText: "Сложная", type: "demo" },
                { id: 7, title: "Оладьи пышные", description: "Быстрые оладьи...", image: "./images/oladiplishnie.webp", time: "20 мин", difficulty: "easy", difficultyText: "Лёгкая", type: "demo" }
            ];
        }
        function getAllRecipes() {
            const user = JSON.parse(localStorage.getItem('userRecipes')) || [];
            return [...getDemoRecipes(), ...user];
        }
        function loadFavorites() {
            const favorites = JSON.parse(localStorage.getItem('favoriteRecipes')) || [];
            const container = document.getElementById('favorites-container');
            const empty = document.getElementById('empty-favorites');
            if (favorites.length === 0) {
                container.style.display = 'none';
                empty.style.display = 'block';
                return;
            }
            container.style.display = 'grid';
            empty.style.display = 'none';
            const allRecipes = getAllRecipes();
            container.innerHTML = favorites.map(recipe => {
                const original = allRecipes.find(r => r.id == recipe.id);
                const isUser = original && original.type === 'user';
                return `
                    <div class="favorite-recipe-card" data-id="${recipe.id}">
                        <div class="favorite-recipe-image">
                            <img src="${recipe.image}" class="recipe-img">
                            ${isUser ? '<div class="user-recipe-badge">Ваш рецепт</div>' : ''}
                            <button class="remove-favorite-btn" data-id="${recipe.id}">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="favorite-recipe-content">
                            <h3 class="recipe-title">${recipe.title}</h3>
                            <p class="recipe-description">${recipe.description}</p>
                            <div class="recipe-meta">
                                <span class="meta-item"><i class="fas fa-clock"></i> ${recipe.time}</span>
                                <span class="difficulty-badge difficulty-${recipe.difficulty}">${recipe.difficultyText}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.favorite-recipe-card').forEach(card => {
                const recipeId = parseInt(card.getAttribute('data-id'));
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.remove-favorite-btn')) return;
                    window.location.href = `recipe.html?id=${recipeId}`;
                });
                const removeBtn = card.querySelector('.remove-favorite-btn');
                if (removeBtn) {
                    removeBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = parseInt(removeBtn.getAttribute('data-id'));
                        removeFromFavorites(id);
                    });
                }
            });
        }
        function removeFromFavorites(id) {
            let fav = JSON.parse(localStorage.getItem('favoriteRecipes')) || [];
            fav = fav.filter(r => r.id != id);
            localStorage.setItem('favoriteRecipes', JSON.stringify(fav));
            loadFavorites();
            showNotification('Удалено из избранного');
        }
        function showNotification(msg) {
            const d = document.createElement('div');
            d.innerText = msg;
            d.style.cssText = `position:fixed; bottom:20px; right:20px; background:#e74c3c; color:white; padding:12px 24px; border-radius:40px; z-index:999;`;
            document.body.appendChild(d);
            setTimeout(() => d.remove(), 2000);
        }
        document.addEventListener('DOMContentLoaded', loadFavorites);
        window.removeFromFavorites = removeFromFavorites;
    </script>
</body>
</html>
