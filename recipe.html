<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепт - Вкусный Блог</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <h1 class="site-title">🍜 Вкусный Блог</h1>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-button"><i class="fas fa-home"></i> Главная</a></li>
                    <li><a href="favorites.html" class="nav-button"><i class="fas fa-heart"></i> Избранное</a></li>
                    <li><a href="add-recipe.html" class="nav-button"><i class="fas fa-plus-circle"></i> Добавить рецепт</a></li>
                    <li><a href="menu-generator.html" class="nav-button"><i class="fas fa-calendar-week"></i> Меню</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="main-content">
        <div class="container" id="recipe-container" style="max-width: 900px; margin: 0 auto;"></div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-main">
                    <p class="footer-slogan">Вкус, который объединяет 🌏</p>
                    <p class="footer-copyright">2026 Вкусный Блог.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://kit.fontawesome.com/e755f937eb.js" crossorigin="anonymous"></script>
    <script>
        function getDemoRecipes() {
            return [
                { id: 1, title: "Паста Карбонара", description: "Классическая итальянская паста с беконом и сливочным соусом.", image: "https://images.unsplash.com/photo-1621996346565-e3dbc353d2e5?w=800&h=600&fit=crop", time: "25 мин", difficulty: "medium", difficultyText: "Средняя", ingredients: "Спагетти 200г\nБекон 100г\nЯйца 2шт\nПармезан 50г\nЧерный перец\nСливки 100мл", instructions: "1. Отварите спагетти до аль денте.\n2. Обжарьте бекон до хруста.\n3. Смешайте яйца с пармезаном.\n4. Соедините всё на сковороде, добавьте перец." },
                { id: 2, title: "Тирамису", description: "Нежный итальянский десерт с маскарпоне и кофе.", image: "https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=800&h=600&fit=crop", time: "40 мин", difficulty: "easy", difficultyText: "Лёгкая", ingredients: "Маскарпоне 250г\nПеченье Савоярди 200г\nКофе эспрессо\nЯйца 3шт\nСахар 100г\nКакао", instructions: "1. Отделите желтки от белков.\n2. Взбейте желтки с сахаром, добавьте маскарпоне.\n3. Взбейте белки отдельно.\n4. Смешайте, обмакивайте печенье в кофе, выкладывайте слоями." },
                { id: 3, title: "Рамен с курицей", description: "Японский суп с лапшой, курицей и яйцом пашот.", image: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=800&h=600&fit=crop", time: "35 мин", difficulty: "hard", difficultyText: "Сложная", ingredients: "Лапша рамен 150г\nКуриное филе 200г\nЯйцо 1шт\nНори\nЧеснок, имбирь, соевый соус", instructions: "1. Сварите бульон с курицей, имбирем и чесноком.\n2. Отварите лапшу.\n3. Сварите яйцо пашот.\n4. Соберите суп: лапша, нарезанная курица, яйцо, нори, залейте бульоном." },
                { id: 4, title: "Салат Цезарь", description: "Хрустящий салат с курицей, сухариками и пармезаном.", image: "https://images.unsplash.com/photo-1550304943-4f24f54dd6c4?w=800&h=600&fit=crop", time: "15 мин", difficulty: "easy", difficultyText: "Лёгкая", ingredients: "Куриное филе 200г\nЛистья салата\nПармезан 50г\nСухарики\nСоус Цезарь", instructions: "1. Обжарьте курицу.\n2. Нарежьте салат.\n3. Смешайте с сухариками и пармезаном, заправьте соусом." },
                { id: 5, title: "Пицца Маргарита", description: "Итальянская пицца с томатами, моцареллой и базиликом.", image: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=800&h=600&fit=crop", time: "30 мин", difficulty: "medium", difficultyText: "Средняя", ingredients: "Тесто для пиццы\nТоматный соус\nМоцарелла 150г\nПомидоры\nБазилик", instructions: "1. Раскатайте тесто.\n2. Смажьте томатным соусом.\n3. Выложите моцареллу и помидоры.\n4. Выпекайте 15 мин при 200°C." },
                { id: 6, title: "Борщ", description: "Насыщенный украинский суп со свеклой и мясом.", image: "https://images.unsplash.com/photo-1588038904885-6b2b5f5a34d0?w=800&h=600&fit=crop", time: "60 мин", difficulty: "hard", difficultyText: "Сложная", ingredients: "Свекла 2шт\nКапуста 300г\nКартофель 3шт\nГовядина 300г\nМорковь, лук, томатная паста", instructions: "1. Сварите бульон на говядине.\n2. Обжарьте свеклу с морковью и луком.\n3. Добавьте нарезанные овощи в бульон.\n4. Варите до готовности, подавайте со сметаной." },
                { id: 7, title: "Оладьи пышные", description: "Быстрые оладьи на кефире – идеальный завтрак.", image: "https://images.unsplash.com/photo-1528207776546-365bb710ee93?w=800&h=600&fit=crop", time: "20 мин", difficulty: "easy", difficultyText: "Лёгкая", ingredients: "Кефир 250мл\nМука 250г\nЯйцо 1шт\nСахар, сода", instructions: "1. Смешайте кефир, яйцо, сахар, соду.\n2. Добавьте муку.\n3. Жарьте на сковороде до золотистости." }
            ];
        }
        function getAllRecipes() {
            const userRecipes = JSON.parse(localStorage.getItem('userRecipes')) || [];
            return [...getDemoRecipes(), ...userRecipes];
        }
        function renderRecipe() {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'));
            if (!id) { document.getElementById('recipe-container').innerHTML = '<div class="ad-banner">Рецепт не найден</div>'; return; }
            const recipe = getAllRecipes().find(r => r.id === id);
            if (!recipe) { document.getElementById('recipe-container').innerHTML = '<div class="ad-banner">Рецепт не найден</div>'; return; }
            const html = `
                <div style="background:white; border-radius:30px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.1);">
                    <img src="${recipe.image}" alt="${recipe.title}" style="width:100%; max-height:500px; object-fit:cover;">
                    <div style="padding:2rem;">
                        <h1 style="font-size:2.5rem;">${recipe.title}</h1>
                        <div style="display:flex; gap:1rem; margin:1rem 0;">
                            <span class="meta-item"><i class="fas fa-clock"></i> ${recipe.time}</span>
                            <span class="difficulty-badge difficulty-${recipe.difficulty}">${recipe.difficultyText}</span>
                        </div>
                        <div style="margin-bottom:2rem;">
                            <h2 style="border-left:5px solid #f0c976; padding-left:1rem;">📝 Ингредиенты</h2>
                            <div style="background:#f9f9f9; padding:1rem; border-radius:20px; margin-top:0.5rem;">
                                ${recipe.ingredients ? recipe.ingredients.replace(/\n/g, '<br>') : 'Не указаны'}
                            </div>
                        </div>
                        <div>
                            <h2 style="border-left:5px solid #f0c976; padding-left:1rem;">👨‍🍳 Приготовление</h2>
                            <div style="margin-top:0.5rem; line-height:1.7;">
                                ${recipe.instructions ? recipe.instructions.replace(/\n/g, '<br>') : recipe.description || 'Описание отсутствует'}
                            </div>
                        </div>
                    </div>
                </div>
                <div class="ad-banner" style="margin-top:2rem;"><div class="ad-placeholder"><i class="fas fa-ad"></i> Реклама</div></div>
            `;
            document.getElementById('recipe-container').innerHTML = html;
        }
        document.addEventListener('DOMContentLoaded', renderRecipe);
    </script>
</body>
</html>
