<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить рецепт - Вкусный Блог</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <h1 class="site-title">🍜 Вкусный Блог</h1>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-button"><i class="fas fa-home"></i> На главную</a></li>
                    <li><a href="favorites.html" class="nav-button"><i class="fas fa-heart"></i> Избранное</a></li>
                    <li><a href="menu-generator.html" class="nav-button"><i class="fas fa-calendar-week"></i> Меню</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="main-content">
        <section class="add-recipe-section">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title">➕ Добавить новый рецепт</h2>
                    <p class="section-subtitle">Поделитесь своим кулинарным шедевром с сообществом</p>
                </div>
                <form class="add-recipe-form" id="add-recipe-form">
                    <div class="form-section">
                        <h3 class="section-title-small">Название рецепта</h3>
                        <input type="text" class="form-input" id="recipe-title" placeholder="Введите название..." required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Краткое описание *</label>
                        <textarea class="form-textarea" id="recipe-description" rows="3" required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Время приготовления</label><input type="text" class="form-input" id="recipe-time" placeholder="30 минут" required></div>
                        <div class="form-group"><label>Сложность</label><select class="form-select" id="recipe-difficulty" required><option value="">Выберите</option><option value="easy">Легкая</option><option value="medium">Средняя</option><option value="hard">Сложная</option></select></div>
                    </div>
                    <div class="form-group"><label>Ингредиенты</label><textarea class="form-textarea" id="recipe-ingredients" rows="4" placeholder="Каждый с новой строки" required></textarea></div>
                    <div class="form-group"><label>Пошаговое приготовление</label><textarea class="form-textarea" id="recipe-instructions" rows="6" required></textarea></div>
                    <div class="form-section">
                        <h3>Фотография блюда</h3>
                        <div class="image-upload-container">
                            <div class="image-preview" id="image-preview"><i class="fas fa-image preview-icon"></i><span class="preview-text">Предпросмотр</span></div>
                            <input type="file" id="recipe-image" accept="image/*" style="display:none">
                            <button type="button" class="upload-button" onclick="document.getElementById('recipe-image').click()"><i class="fas fa-upload"></i> Выбрать фото</button>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="cancel-button" onclick="window.location.href='index.html'">Отмена</button>
                        <button type="submit" class="submit-button">Добавить рецепт</button>
                    </div>
                </form>
            </div>
        </section>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-main">
                    <p class="footer-slogan">Вкус, который объединяет 🌏</p>
                    <p class="footer-copyright">2026 Вкусный Блог.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://kit.fontawesome.com/e755f937eb.js" crossorigin="anonymous"></script>
    <script>
        document.getElementById('recipe-image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const preview = document.getElementById('image-preview');
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { preview.innerHTML = `<img src="${e.target.result}" style="max-width:100%; max-height:200px;">`; }
                reader.readAsDataURL(file);
            }
        });
        function showNotification(msg, type) {
            const div = document.createElement('div');
            div.innerText = msg;
            div.style.cssText = `position:fixed; bottom:20px; right:20px; background:${type === 'success' ? '#f0c976' : '#e74c3c'}; color:#1E1E2A; padding:12px 24px; border-radius:40px; z-index:999; font-weight:bold;`;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }
        document.getElementById('add-recipe-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('recipe-title').value.trim();
            const description = document.getElementById('recipe-description').value.trim();
            const time = document.getElementById('recipe-time').value.trim();
            const difficulty = document.getElementById('recipe-difficulty').value;
            const difficultyText = document.getElementById('recipe-difficulty').options[document.getElementById('recipe-difficulty').selectedIndex]?.text || '';
            const ingredients = document.getElementById('recipe-ingredients').value.trim();
            const instructions = document.getElementById('recipe-instructions').value.trim();
            const imageElem = document.querySelector('#image-preview img');
            const image = imageElem ? imageElem.src : '';
            if (!title || !time || !difficulty || !ingredients || !instructions || !image) {
                showNotification('Заполните все поля и загрузите фото', 'error');
                return;
            }
            const newRecipe = {
                id: Date.now(),
                title, description, time, difficulty, difficultyText,
                ingredients, instructions, image,
                type: 'user'
            };
            const userRecipes = JSON.parse(localStorage.getItem('userRecipes')) || [];
            userRecipes.push(newRecipe);
            localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
            showNotification('Рецепт добавлен!', 'success');
            setTimeout(() => window.location.href = 'index.html', 1500);
        });
    </script>
</body>
</html>
